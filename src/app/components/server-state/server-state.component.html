<div class="card">
  <div class="card-header button-header collapsible-header" (click)="toggleVisibility()">
    <h2>SERVER STATE</h2>
    <div class="button-header-actions">
      <button class="btn" (click)="onStartServer($event)"
        [disabled]="!canStart">
        <iconify-icon icon="material-symbols:play-arrow" class="shrink-0"></iconify-icon> Start
      </button>
      <button class="btn" (click)="onStopServer($event)" [disabled]="!canStop">
        <iconify-icon icon="material-symbols:stop" class="shrink-0"></iconify-icon> Stop
      </button>
      <button class="btn" (click)="onForceStopServer($event)" [disabled]="!canForceStop">
        <iconify-icon icon="material-symbols:power-settings-new" class="shrink-0"></iconify-icon> Force
      </button>
      <iconify-icon icon="{{ isVisible ? 'material-symbols:expand-more' : 'material-symbols:expand-less' }}" class="shrink-0"></iconify-icon>
    </div>
  </div>
  <div class="card-body" *ngIf="isVisible">
    <div class="server-state-header-row">
      <span class="text-sm">Status:</span>
      <span class="status-badge" [ngClass]="statusClasses">
        {{ statusText }}
      </span>
      <span class="players-indicator font-mono text-sm" *ngIf="serverInstance.state && serverInstance.state === 'Running' && maxPlayers !== null">
        Players: {{ currentPlayers }} / {{ maxPlayers }}
      </span>
      <span class="memory-indicator font-mono text-sm" *ngIf="serverInstance.state && serverInstance.state === 'Running' && memoryUsage">
        Memory: {{ memoryUsage }} MB
      </span>
    </div>
    <div class="text-sm text-slate-400 mb-2" *ngIf="serverMessage">
      {{ serverMessage }}
    </div>
    <div class="console-log-container" #logContainer>
      <ng-container *ngIf="logs && logs.length; else noLogs">
        <div class="console-log-line" *ngFor="let line of logs">
          {{ line }}
        </div>
      </ng-container>
      <ng-template #noLogs>
        <div class="console-log-placeholder">
          No output yet. Start the server to see logs...
        </div>
      </ng-template>
    </div>
  </div>
</div>
