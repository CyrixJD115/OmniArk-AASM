<div class="card rcon-card">
  <div class="card-header button-header collapsible-header" (click)="showRcon = !showRcon">
    <h2>RCON</h2>
    <div class="button-header-actions">
      <button class="btn btn-ghost" [disabled]="!rconConnected || serverState !== 'Running' || !rconMessage.trim()" (click)="$event.stopPropagation(); onSendMessage();">
        <iconify-icon icon="material-symbols:send" class="shrink-0"></iconify-icon> Send
      </button>
      <iconify-icon icon="{{ showRcon ? 'material-symbols:expand-more' : 'material-symbols:expand-less' }}" class="shrink-0"></iconify-icon>
    </div>
  </div>
  <div class="card-body" *ngIf="showRcon">
    <div class="rcon-status-row flex items-center gap-2 text-sm mb-4">
      <span>Status:</span>
      <span class="status-badge" [ngClass]="{
        'status-running': rconConnected,
        'status-stopped': !rconConnected
      }">
        {{ rconConnected ? 'Connected' : 'Disconnected' }}
      </span>
    </div>
    <div class="rcon-send-row relative w-full" *ngIf="rconConnected && serverState === 'Running'">
      <div class="flex gap-2 items-center w-full relative">
        <input class="form-control flex-1" [(ngModel)]="rconMessage" placeholder="Type RCON command or message..." (keyup.enter)="onSendMessage()" (focus)="onInputFocus()" (blur)="onInputBlur()" />
        <div *ngIf="inputFocused" class="rcon-known-commands absolute left-0 right-0 top-full bg-[#23272f] border border-[#444] rounded-md z-10 shadow-lg min-w-[220px] w-full">
          <div *ngFor="let cmd of knownCommands" (mousedown)="fillCommand(cmd)" class="px-4 py-2 cursor-pointer text-[#b0b6c1] text-sm whitespace-pre hover:bg-white/5">
            {{ cmd }}
          </div>
        </div>
      </div>
    </div>
    <div *ngIf="lastResponse" class="rcon-response bg-[#23272f] border border-[#444] rounded-md mt-4 px-4 py-3 text-[#b0b6c1] font-mono text-sm whitespace-pre-wrap max-h-[300px] overflow-y-auto">
      <div class="font-bold text-[#8ab4f8] mb-1">Last Response:</div>
      <div>{{ lastResponse }}</div>
    </div>
  </div>
</div>
